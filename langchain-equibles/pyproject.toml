[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-equibles"
version = "0.1.0"
description = "LangChain tools for Equibles: SEC filings, earnings call transcripts, financial statements, ownership and market data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Equibles", email = "social@equibles.com" }]
keywords = ["langchain", "equibles", "finance", "sec-filings", "earnings-calls", "agents", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://equibles.com"
Documentation = "https://equibles.com/docs"
Repository = "https://github.com/equibles/equibles-integrations"
Issues = "https://github.com/equibles/equibles-integrations/issues"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "langchain-tests>=1.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_equibles"]

[tool.pytest.ini_options]
markers = ["live: calls the live Equibles API (needs network; some tests need EQUIBLES_API_KEY)"]
addopts = "-m 'not live'"
asyncio_default_fixture_loop_scope = "function"
